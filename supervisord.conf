[supervisord]
nodaemon=true
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=50MB
logfile_backups=10
loglevel=info
pidfile=/var/run/supervisord.pid
user=elco

[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/nginx_stderr.log
stdout_logfile=/var/log/supervisor/nginx_stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true

[program:fastapi]
command=uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 4 --loop uvloop --http httptools
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/fastapi_stderr.log
stdout_logfile=/var/log/supervisor/fastapi_stdout.log
stdout_logfile_maxbytes=50MB
stdout_logfile_backups=10
redirect_stderr=true
environment=PYTHONPATH=/app,PYTHONUNBUFFERED=1
stopasgroup=true
killasgroup=true

[program:position-monitor]
command=python -m app.position_monitor
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/position_monitor_stderr.log
stdout_logfile=/var/log/supervisor/position_monitor_stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true
environment=PYTHONPATH=/app,PYTHONUNBUFFERED=1

[program:market-daemon]
command=python -m app.data.market_daemon
directory=/app
autostart=true
autorestart=true
startretries=3
stderr_logfile=/var/log/supervisor/market_daemon_stderr.log
stdout_logfile=/var/log/supervisor/market_daemon_stdout.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=5
redirect_stderr=true
environment=PYTHONPATH=/app,PYTHONUNBUFFERED=1

