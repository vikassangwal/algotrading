[project]
name = "elco"
version = "0.1.0"
description = "ELCO — Indian stock market trading analysis engine (decision-support tool, not financial advice)"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "python-dotenv>=1.0",
    "SQLAlchemy>=2.0",
    "pandas>=2.2",
    "numpy>=1.26",
    "scipy>=1.13",
    "yfinance>=0.2.40",
    "requests>=2.31",
    "vaderSentiment>=3.3.2",
    "scikit-learn>=1.4",
    "statsmodels>=0.14",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
