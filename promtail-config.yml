server:
  http_listen_port: 9080
  grpc_listen_port: 0

positions:
  filename: /tmp/positions.yaml

clients:
  - url: http://loki:3100/loki/api/v1/push

scrape_configs:
  - job_name: elco-api
    static_configs:
      - targets:
          - localhost
        labels:
          job: elco-api
          environment: production
          __path__: /var/log/supervisor/fastapi_stdout.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            module: module
            function: function
            line: line
      - labels:
          level:
          logger:
          module:
      - timestamp:
          source: timestamp
          format: RFC3339

  - job_name: elco-api-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: elco-api-error
          environment: production
          __path__: /var/log/supervisor/fastapi_stderr.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            logger: logger
            message: message
            module: module
            function: function
            line: line
      - labels:
          level:
          logger:
          module:
      - timestamp:
          source: timestamp
          format: RFC3339

  - job_name: nginx-access
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-access
          environment: production
          __path__: /var/log/nginx/access.log
    pipeline_stages:
      - regex:
          expression: '^(?P<remote_addr>\S+) - (?P<remote_user>\S+) \[(?P<time_local>[^\]]+)\] "(?P<request>[^"]+)" (?P<status>\d+) (?P<body_bytes_sent>\d+) "(?P<http_referer>[^"]*)" "(?P<http_user_agent>[^"]*)" (?P<request_time>\S+) (?P<upstream_connect_time>\S+) (?P<upstream_header_time>\S+) (?P<upstream_response_time>\S+)'
      - labels:
          status:
      - timestamp:
          source: time_local
          format: "02/Jan/2006:15:04:05 -0700"

  - job_name: nginx-error
    static_configs:
      - targets:
          - localhost
        labels:
          job: nginx-error
          environment: production
          __path__: /var/log/nginx/error.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}/\d{2}/\d{2} \d{2}:\d{2}:\d{2}) \[(?P<level>\w+)\] (?P<pid>\d+)#(?P<tid>\d+): (?P<message>.*)'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: "2006/01/02 15:04:05"

  - job_name: supervisor
    static_configs:
      - targets:
          - localhost
        labels:
          job: supervisor
          environment: production
          __path__: /var/log/supervisor/supervisord.log
    pipeline_stages:
      - regex:
          expression: '^(?P<timestamp>\d{4}-\d{2}-\d{2} \d{2}:\d{2}:\d{2},\d{3}) (?P<level>\w+) (?P<message>.*)'
      - labels:
          level:
      - timestamp:
          source: timestamp
          format: "2006-01-02 15:04:05,000"

  - job_name: position-monitor
    static_configs:
      - targets:
          - localhost
        labels:
          job: position-monitor
          environment: production
          __path__: /var/log/supervisor/position_monitor_stdout.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            symbol: symbol
            action: action
      - labels:
          level:
          symbol:
          action:
      - timestamp:
          source: timestamp
          format: RFC3339

  - job_name: market-daemon
    static_configs:
      - targets:
          - localhost
        labels:
          job: market-daemon
          environment: production
          __path__: /var/log/supervisor/market_daemon_stdout.log
    pipeline_stages:
      - json:
          expressions:
            timestamp: timestamp
            level: level
            message: message
            symbol: symbol
            price: price
      - labels:
          level:
          symbol:
      - timestamp:
          source: timestamp
          format: RFC3339