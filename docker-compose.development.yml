version: '3.8'

services:
  elco-trader:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    environment:
      - ENVIRONMENT=development
      - LOG_LEVEL=DEBUG
      - ELCO_CORS_ORIGINS=http://localhost:3000,http://localhost:5173,http://127.0.0.1:3000,http://127.0.0.1:5173
      - VITE_API_URL=http://localhost:8000
    volumes:
      - ./app:/app/app:ro
      - ./frontend/src:/app/frontend/src:ro
    ports:
      - "8000:8000"
      - "5173:5173"
    command: >
      sh -c "
        uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload &
        cd /app/frontend && npm run dev -- --host 0.0.0.0 --port 5173
      "
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 1G

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --appendonly yes
    volumes:
      - redis-dev-data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=elco_trader
      - POSTGRES_USER=elco
      - POSTGRES_PASSWORD=devpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres-dev-data:/var/lib/postgresql/data

volumes:
  redis-dev-data:
  postgres-dev-data: