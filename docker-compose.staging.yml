version: '3.8'

services:
  elco-trader:
    image: ghcr.io/${GITHUB_REPOSITORY:-elco-trader}:develop
    environment:
      - ENVIRONMENT=staging
      - LOG_LEVEL=DEBUG
      - ELCO_CORS_ORIGINS=http://staging.yourdomain.com,http://localhost:3000
      - VITE_API_URL=http://staging-api.yourdomain.com
      - ELCO_SECRET_KEY=${ELCO_SECRET_KEY}
      - DATABASE_URL=postgresql://elco:${POSTGRES_PASSWORD}@postgres:5432/elco_trader_staging
      - REDIS_URL=redis://redis:6379/0
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: '1'
          memory: 1G
        reservations:
          cpus: '0.5'
          memory: 512M
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

  redis:
    image: redis:7-alpine
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-staging-data:/data

  postgres:
    image: postgres:15-alpine
    environment:
      - POSTGRES_DB=elco_trader_staging
      - POSTGRES_USER=elco
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD}
    volumes:
      - postgres-staging-data:/var/lib/postgresql/data

volumes:
  redis-staging-data:
  postgres-staging-data: